<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Robo Sling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>ROBO SLING</h1>
        <div id="hud">
            <span>Score: <b id="score">0</b></span>
            <span>Shots: <b id="shots">5</b></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <button id="resetBtn">RESET</button>
        <p id="message">Drag the robot backwards and release!</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
