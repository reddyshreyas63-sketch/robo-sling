<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo Sling</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
.ui{position:absolute;top:22px;left:25px;right:25px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:rgba(15,35,55,.9);color:white;padding:14px 20px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.title{font-size:28px;font-weight:900;letter-spacing:1px}
.sub{font-size:12px;opacity:.7;margin-top:3px}
.stats{display:flex;gap:25px;font-weight:700}
.stats b{color:#ffd166}
#help{position:absolute;left:25px;bottom:20px;background:rgba(15,35,55,.9);color:white;padding:12px 18px;border-radius:12px;font-size:14px}
#power{position:absolute;left:25px;bottom:67px;width:230px;display:none;color:white;font-size:12px;font-weight:bold}
#bar{height:14px;background:rgba(0,0,0,.5);border-radius:9px;overflow:hidden;margin-top:5px}
#fill{height:100%;width:0%;background:#ffd166}
button{position:fixed;right:25px;bottom:20px;border:0;background:#111827;color:white;padding:13px 21px;border-radius:11px;font-weight:800;cursor:pointer;z-index:10}
#serialBtn{position:fixed;right:25px;bottom:82px;background:#183b56;z-index:10}
#status{position:fixed;right:25px;bottom:140px;color:white;background:rgba(15,35,55,.9);padding:7px 12px;border-radius:9px;font-size:12px;z-index:10}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(10,20,30,.95);color:white;padding:25px 40px;border-radius:18px;font-size:28px;font-weight:900;text-align:center}

/* ===== LEVEL SELECTOR ===== */
#levelButtons{
  position:fixed;
  right:25px;
  bottom:190px;
  display:flex;
  gap:8px;
  z-index:10;
}
#levelButtons button{
  position:static;
  margin:0;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(15,35,55,.92);
  color:white;
  border-radius:10px;
  font-weight:800;
}
#levelButtons button.active{
  box-shadow:0 0 0 2px rgba(255,255,255,.22), 0 0 18px rgba(255,255,255,.18);
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 20% 15%, rgba(214, 150, 65, 0.14), transparent 28%),
        linear-gradient(135deg, #17120d 0%, #2a1b10 48%, #100e0b 100%);

/* =========================================================
   ROBO SLING — LEVEL THEMES
   Add class="level-1" or class="level-2" to <body>.
   ========================================================= */

/* LEVEL 1 — CUTE / CARTOON */
body.level-1{
  background:
    radial-gradient(circle at 18% 16%, rgba(255,244,184,.65), transparent 22%),
    radial-gradient(circle at 78% 22%, rgba(255,185,214,.40), transparent 26%),
    linear-gradient(180deg,#9fdcff 0%,#dff6ff 58%,#b8e88c 100%);
}

body.level-1 h1{
  letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 3px 0 rgba(255,255,255,.75),0 0 14px rgba(255,170,210,.45);
}

body.level-1 canvas{
  background:
    radial-gradient(circle at 78% 18%, rgba(255,247,189,.72), transparent 18%),
    linear-gradient(180deg,#8fd7ff 0%,#d9f5ff 58%,#86c96f 58%,#69aa52 100%);
  border-color:#ffffff;
  box-shadow:
    inset 0 0 35px rgba(255,255,255,.22),
    0 0 22px rgba(255,166,205,.24);
}

body.level-1 button{
  border-color:rgba(255,255,255,.55);
  background:#24415d;
  color:#fff;
  border-radius:14px;
}

  border-color:rgba(255,255,255,.7);

  color:#fff6fb;
}

  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 18px rgba(255,143,188,.38);
}

/* LEVEL 2 — FUTURISTIC */
body.level-2 {

        radial-gradient(circle at 15% 20%, rgba(45, 220, 255, .16), transparent 25%),
        radial-gradient(circle at 85% 75%, rgba(112, 78, 255, .18), transparent 30%),
        linear-gradient(135deg, #030712 0%, #08152b 50%, #02030a 100%);
}

body.level-2 h1 {
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow:
        0 0 8px rgba(70, 220, 255, .75),
        0 0 20px rgba(76, 91, 255, .35);
}

body.level-2 canvas {
    background:
        linear-gradient(rgba(6, 20, 39, .35), rgba(2, 6, 18, .55)),
        radial-gradient(circle at 70% 22%, rgba(53, 214, 255, .16), transparent 22%),
        repeating-linear-gradient(90deg, rgba(58, 180, 255, .055) 0 1px, transparent 1px 70px),
        repeating-linear-gradient(0deg, rgba(58, 180, 255, .045) 0 1px, transparent 1px 70px),
        linear-gradient(180deg, #07172b 0%, #0a2540 62%, #020713 62%, #040817 100%);
    border-color: #42dfff;
    box-shadow:
        inset 0 0 55px rgba(0, 0, 0, .58),
        0 0 25px rgba(42, 216, 255, .22);

/* Optional level-specific controls */

    border: 1px solid rgba(66, 223, 255, .65);
    background: #071326;

body.level-2 #message {

<body>

<canvas id="game"></canvas>

<div class="ui">
  <div class="panel">
    <div class="title">ROBO SLING</div>
    <div class="sub">PHYSICS TARGET CHALLENGE</div>
  </div>
  <div class="panel stats">
    <div>SCORE <b id="score">0</b></div>
    <div>SHOTS <b id="shots">0</b></div>
    <div>TARGETS <b id="targets">5</b></div>
  </div>
</div>

<div id="power">
  LAUNCH POWER
  <div id="bar"><div id="fill"></div></div>
</div>

<div id="help">DRAG ROBO BACK → RELEASE TO LAUNCH<br>W/S AIM · A/D POWER · SPACE FIRE · R RESET</div>
<div id="levelButtons">
  <button id="level1Btn" aria-label="Play Level 1">LEVEL 1</button>
  <button id="level2Btn" aria-label="Play Level 2">LEVEL 2</button>
</div>
<button id="serialBtn" title="Connect an ESP32 or compatible Web Serial controller">CONNECT CONTROLLER</button>
<button id="reset">RESET</button>
<div id="status">CONTROL: MOUSE</div>
<div id="msg"></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=1500;
const H=720;

let view={scale:1,ox:0,oy:0,dpr:1};
function resizeCanvas(){
  const cssW=Math.max(320,window.innerWidth);
  const cssH=Math.max(240,window.innerHeight);
  view.dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(cssW*view.dpr);
  canvas.height=Math.floor(cssH*view.dpr);
  view.scale=Math.min(cssW/W,cssH/H);
  view.ox=(cssW-W*view.scale)/2;
  view.oy=(cssH-H*view.scale)/2;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
}
window.addEventListener("resize",resizeCanvas,{passive:true});
resizeCanvas();

const G=900;
const GROUND=590;
const POWER_MULT=7.0;
const MAX_PULL=155;
const PIG_BOUNCE=0.06;

const SLING={x:185,y:400};

let score=0;
let shots=0;
let dragging=false;
let gameWon=false;
let structureActivated=false;
let level=1;
let levelShots=0;

let currentRobo=null;
let robos=[];

// Software/hardware control layer.
let controlMode="mouse";
let hardwareAim=0;      // -1 = up, 0 = level, +1 = down
let hardwarePower=0;    // 0..1
let serialPort=null;
let serialReader=null;
let serialConnected=false;
let serialBuffer="";

// Keyboard simulation state.
// W/S = aim, A/D = power, SPACE = fire.
let keyboardAim=0;
let keyboardPower=0;
let keyboardActive=false;

let blocks=[];
let pigs=[];
let stars=[];
let rings=[];
let particles=[];
let cameraShake=0;


/* =========================
   OBJECT CREATION
========================= */

let pouch={x:SLING.x,y:SLING.y};

function newRobo(){
  return {
    x:SLING.x-65,
    y:SLING.y,
    vx:0,
    vy:0,
    radius:26,
    rotation:0,
    ready:true
  };
}

function makeBlock(x,y,w,h,booster=false){
  return {
    x,y,w,h,
    spawnX:x,
    spawnY:y,
    vx:0,
    vy:0,
    health:100,
    maxHealth:100,
    destroyed:false,
    falling:false,
    awake:false,
    booster:booster,
    boosterPower:booster ? 1.02 : 0
  };
}

function makePig(x,y){
  return {
    x,y,
    spawnX:x,
    spawnY:y,
    radius:29,
    vx:0,
    vy:0,
    alive:true,
    supported:true,
    crushCooldown:0,
    spawnGrace:2.0,
    lastDamageShot:-1,
    hitFlash:0
  };
}

/* =========================
   LEVEL
========================= */

function createLevel(){
  if(level===2){
    createLevel2();
    return;
  }

  // LEVEL 1 — CUTE CARTOON
  blocks=[
    makeBlock(850,555,560,35),
    makeBlock(850,425,45,132),
    makeBlock(1365,425,45,132),
    makeBlock(890,395,520,32),
    makeBlock(1000,255,45,142),
    makeBlock(1255,255,45,142),
    makeBlock(1040,225,260,32),
    makeBlock(1090,150,45,77),
    makeBlock(1165,150,45,77),
    makeBlock(1120,120,60,32)
  ];

  pigs=[
    makePig(945,526),
    makePig(1120,526),
    makePig(1295,526),
    makePig(1070,366),
    makePig(1230,366)
  ];

  // Level 1 enemies need two successful shots.
  for(const p of pigs){
    p.maxHealth=2;
    p.health=2;
  }

  stars=[
    {x:430,y:270,r:17,taken:false,points:150},
    {x:680,y:190,r:17,taken:false,points:150},
    {x:820,y:250,r:17,taken:false,points:200},
    {x:1430,y:220,r:17,taken:false,points:250}
  ];

  rings=[
    {x:540,y:400,r:40,taken:false,points:100},
    {x:760,y:350,r:40,taken:false,points:100},
    {x:900,y:150,r:40,taken:false,points:100}
  ];
}

function createLevel2(){
  // LEVEL 2 — FUTURISTIC / CYBER CITY
  // Connected tower with selective jet-assisted platforms.
  blocks=[
    // Ground foundation
    makeBlock(810,555,620,35),

    // Lower supports — directly under the lower deck
    makeBlock(850,420,50,135),
    makeBlock(1340,420,50,135),

    // Lower deck — JET BOOSTERS keep this platform suspended
    makeBlock(900,385,440,35,true),

    // Middle supports — directly on the lower deck
    makeBlock(965,250,50,135),
    makeBlock(1225,250,50,135),

    // Middle deck — JET BOOSTERS
    makeBlock(1015,215,210,35,true),

    // Upper supports
    makeBlock(1060,140,42,75),
    makeBlock(1158,140,42,75),

function resetGame(){
  level=1;
  levelShots=0;
  structureActivated=false;

  score=0;
  shots=0;
  dragging=false;
  gameWon=false;

  keyboardAim=0;
  keyboardPower=0;
  keyboardActive=false;
  hardwareAim=0;
  hardwarePower=0;

  robos=[];
  particles=[];
  cameraShake=0;
  last=performance.now();

  createLevel();

  currentRobo=newRobo();
  if(controlMode==="serial") updateHardwarePouch();

  updateUI();

  document.getElementById("power").style.display="none";
  document.getElementById("msg").style.display="none";
  document.getElementById("power").style.display="none";
}

function updateUI(){

  document.getElementById("score").textContent=score;
  document.getElementById("shots").textContent=shots;

  document.getElementById("targets").textContent=
    pigs.filter(p=>p.alive).length;

  const title=document.querySelector(".title");
  const sub=document.querySelector(".sub");
  const l1=document.getElementById("level1Btn");
  const l2=document.getElementById("level2Btn");

  if(title) title.textContent = level===2 ? "ROBO SLING // LEVEL 2" : "ROBO SLING";
  if(sub) sub.textContent = level===2
    ? "FUTURE CITY // JET-BOOSTED PHYSICS CHALLENGE"
    : "CUTE CITY // TWO-HIT TARGET CHALLENGE";

  document.body.classList.toggle("level-2",level===2);
  if(l1) l1.classList.toggle("active",level===1);
  if(l2) l2.classList.toggle("active",level===2);
}


/* =========================
   INPUT
========================= */

function setControlMode(mode){
  controlMode=mode;
  updateControllerStatus();
}

function updateControllerStatus(){
  const status=document.getElementById("status");

  if(controlMode==="keyboard"){
    const p=Math.round(keyboardPower*100);
    const a=Math.round(keyboardAim*100);
    status.textContent=`CONTROL: KEYBOARD  |  POWER ${p}%  |  AIM ${a}`;
    return;
  }

  if(controlMode!=="serial"){
    status.textContent="CONTROL: MOUSE";
    return;
  }

  const p=Math.round(hardwarePower*100);
  const a=Math.round(hardwareAim*100);
  status.textContent=`CONTROL: CONTROLLER  |  POWER ${p}%  |  AIM ${a}`;
}

function setPouchFromControls(power, aim){

  if(!currentRobo || !currentRobo.ready)
    return;

  power = Math.max(0, Math.min(1, power));
  aim   = Math.max(-1, Math.min(1, aim));

  // Maximum pull distance
  const pull = power * MAX_PULL;

  // Maximum aiming angle
  // -100 AIM = very high
  // 0 AIM = center
  // +100 AIM = very low
  const angle = aim * 3.5;

  // Convert angle + pull into slingshot position
  const dx =
    -pull /
    Math.sqrt(1 + angle * angle);

  const dy =
    -dx * angle;

  // Move Robo
  pouch.x = SLING.x + dx;
  pouch.y = SLING.y + dy;

  currentRobo.x = pouch.x;
  currentRobo.y = pouch.y;

  // Power bar
  document.getElementById("fill").style.width =
    (power * 100) + "%";
}
function updateHardwarePouch(){
  setPouchFromControls(hardwarePower,hardwareAim);
}

function updateKeyboardPouch(){
  setPouchFromControls(keyboardPower,keyboardAim);
}

function handleSerialLine(line){
  line=line.trim();
  if(!line) return;

  const upper=line.toUpperCase();

  if(upper.startsWith("AIM:")){
    const raw=parseFloat(line.substring(4));
    if(Number.isFinite(raw)){
      hardwareAim = raw > 1 || raw < -1
        ? Math.max(-1,Math.min(1,raw/100))
        : Math.max(-1,Math.min(1,raw));
      if(controlMode==="serial") updateHardwarePouch();
      updateControllerStatus();
    }
    return;
  }

  if(upper.startsWith("POWER:")){
    const raw=parseFloat(line.substring(6));
    if(Number.isFinite(raw)){
      hardwarePower = raw > 1
        ? Math.max(0,Math.min(1,raw/100))
        : Math.max(0,Math.min(1,raw));
      if(controlMode==="serial") updateHardwarePouch();
      updateControllerStatus();
    }
    return;
  }

  if(upper==="FIRE"){
    if(controlMode==="serial" && currentRobo && currentRobo.ready && !gameWon){
      updateHardwarePouch();
      fireRobo();
    }
    return;
  }

  if(upper==="RESET"){
    resetGame();
    updateControllerStatus();
    return;
  }
}

async function readSerial(){
  if(!serialReader) return;
  try{
    while(true){
      const {value,done}=await serialReader.read();
      if(done) break;
      if(value){
        serialBuffer+=new TextDecoder().decode(value);
        const lines=serialBuffer.split(/\r?\n/);
        serialBuffer=lines.pop()||"";
        for(const line of lines) handleSerialLine(line);
      }
    }
  }catch(err){
    console.error("Serial read error",err);
  }finally{
    try{serialReader.releaseLock();}catch(e){}
    serialReader=null;

    // If the browser/USB device drops the stream, do not leave the UI
    // stuck in "connected" mode.
    if(serialConnected){
      serialConnected=false;
      serialPort=null;
      controlMode="mouse";
      document.getElementById("serialBtn").textContent="CONNECT CONTROLLER";
      updateControllerStatus();
    }
  }
}

async function connectSerial(){
  if(!("serial" in navigator)){
    alert("Web Serial is not supported in this browser. Use Chrome or Edge.");
    return;
  }
  try{
    serialPort=await navigator.serial.requestPort();
    await serialPort.open({baudRate:115200});

    serialConnected=true;
    setControlMode("serial");
    document.getElementById("serialBtn").textContent="CONTROLLER CONNECTED";

    // Start reading BEFORE applying the current controller state.
    serialReader=serialPort.readable.getReader();
    readSerial();

    // Give the reader one browser tick to start receiving Arduino data.
    setTimeout(()=>{
      if(serialConnected && controlMode==="serial") updateHardwarePouch();
    },50);
  }catch(err){
    console.error(err);
    serialConnected=false;
    setControlMode("mouse");
    alert("ESP32 connection was not established.");
  }
}

async function disconnectSerial(){
  try{
    if(serialReader){try{await serialReader.cancel();}catch(e){}}
    if(serialPort){try{await serialPort.close();}catch(e){}}
  }finally{
    serialReader=null;
    serialPort=null;
    serialConnected=false;
    setControlMode("mouse");
    document.getElementById("serialBtn").textContent="CONNECT CONTROLLER";
  }
}

document.getElementById("serialBtn").addEventListener("click",async()=>{
  if(serialConnected) await disconnectSerial();
  else await connectSerial();
});

function pos(e){

  const r=canvas.getBoundingClientRect();

  return {
    x:(e.clientX-r.left-view.ox)/view.scale,
    y:(e.clientY-r.top-view.oy)/view.scale
  };
}

canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(e.button!==0) return;

  if(controlMode==="serial" || !currentRobo || !currentRobo.ready || gameWon)
    return;

  controlMode="mouse";
  keyboardActive=false;
  updateControllerStatus();

  const p=pos(e);

  const dx=p.x-currentRobo.x;
  const dy=p.y-currentRobo.y;

  if(Math.hypot(dx,dy)<60){

    dragging=true;

    canvas.setPointerCapture(e.pointerId);

    document.getElementById("power").style.display="block";
  }
});


canvas.addEventListener("pointermove",e=>{
  e.preventDefault();

  if(!dragging || !currentRobo || !currentRobo.ready)
    return;

  const p=pos(e);

  // A slingshot can only be pulled away from the fork.
  // Do not force a 25px minimum pull: that used to make "0 power"
  // launch with non-zero velocity.
  let dx=Math.min(p.x-SLING.x,0);
  let dy=p.y-SLING.y;

  let d=Math.hypot(dx,dy);

  if(d>MAX_PULL){
    dx=dx/d*MAX_PULL;
    dy=dy/d*MAX_PULL;
    d=MAX_PULL;
  }

  currentRobo.x=SLING.x+dx;
  currentRobo.y=SLING.y+dy;

  // Display the actual pull distance, not the pre-clamp mouse distance.
  document.getElementById("fill").style.width=
    Math.round(d/MAX_PULL*100)+"%";
});


function releaseMouseShot(e){
  if(!dragging) return;
  dragging=false;
  try{ if(e && e.pointerId!=null) canvas.releasePointerCapture(e.pointerId); }catch(err){}
  document.getElementById("power").style.display="none";
  if(currentRobo && currentRobo.ready) fireRobo();
}

canvas.addEventListener("pointerup",releaseMouseShot);
canvas.addEventListener("pointercancel",releaseMouseShot);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{
  last=performance.now();
  dragging=false;
  if(document.hidden) document.getElementById("power").style.display="none";
});


/* =========================
   FIRE ROBO
========================= */

function fireRobo(){

  const r=currentRobo;

  const dx=SLING.x-r.x;
  const dy=SLING.y-r.y;

  const pull=Math.min(MAX_PULL,Math.hypot(dx,dy));

  // Prevent accidental zero-power shots from consuming a shot.
  if(pull<8){
    r.x=SLING.x;
    r.y=SLING.y;
    return;
  }

  const damage=Math.max(
    0,
    Math.min(100,pull/MAX_PULL*100)
  );

  const level2Boost = level===2;

  const fired={

    x:r.x,
    y:r.y,

    // Level 2 uses twin jet boosters for a faster launch.
    vx:dx*POWER_MULT*(level2Boost ? 1.35 : 1),
    vy:dy*POWER_MULT*(level2Boost ? 1.35 : 1),

    // Jet fuel/thrust only exists in Level 2.
    jetFuel: level2Boost ? 1.15 : 0,
    jetThrust: level2Boost ? 620 : 0,

    radius:r.radius,

    rotation:0,

    active:true,

    /*
      IMPORTANT:
      This starts FALSE.

      The moment this Robo touches the ground,
      it becomes TRUE and stays TRUE forever.
    */
    bounced:false,

    /*
      Launch power determines block damage.
      Full pull = 100 damage.
      98% pull = 98 damage.
    */
    damage:damage,

    hitBlocks:new Set(),
    hitPigs:new Set()
  };

  robos.push(fired);

  currentRobo=null;

  shots++;
  levelShots++;

  updateUI();

  burst(fired.x,fired.y,12);
  cameraShake=Math.max(cameraShake,2.5);

  setTimeout(()=>{

    if(!gameWon && !currentRobo){
      currentRobo=newRobo();

      if(controlMode==="serial"){
        updateHardwarePouch();
      }else if(keyboardActive || controlMode==="keyboard"){
        controlMode="keyboard";
        updateKeyboardPouch();
        updateControllerStatus();
      }
    }

  },2000);
}


/* =========================
   ROBO PHYSICS
========================= */

function updateRobos(dt){

  for(const r of robos){

    if(!r.active)
      continue;

    /*
      LEVEL 2 JET BOOST:
      Two rear thrusters accelerate the Robo in its current flight direction
      for a limited burst. This adds real velocity instead of only changing
      the sprite.
    */
    if(level===2 && (r.jetFuel||0)>0){

      const speed=Math.hypot(r.vx,r.vy);

      if(speed>10){
        const nx=r.vx/speed;
        const ny=r.vy/speed;

        const thrust=Math.min(r.jetFuel,dt)*r.jetThrust;

        r.vx+=nx*thrust;
        r.vy+=ny*thrust;

        r.jetFuel=Math.max(0,r.jetFuel-dt);
      }else{
        r.jetFuel=Math.max(0,r.jetFuel-dt);
      }
    }

    r.vy+=G*dt;

    r.vx*=Math.pow(.999,dt*60);
    r.vy*=Math.pow(.999,dt*60);

    r.x+=r.vx*dt;
    r.y+=r.vy*dt;

    r.rotation+=r.vx*dt*.018;


    /*
      GROUND COLLISION

      This is the important part.

      As soon as the Robo touches the ground:
          bounced = true

      It NEVER becomes false again.

      Therefore this Robo can never damage a block
      after a ground bounce.
    */

    if(r.y+r.radius>=GROUND){

      r.y=GROUND-r.radius;

      r.bounced=true;

      if(Math.abs(r.vy)>30){

        r.vy*=-0.72;

      }else{

        r.vy=0;
      }

      r.vx*=0.90;

      if(Math.abs(r.vx)<15 && Math.abs(r.vy)<15)
        r.active=false;
    }


    /*
      WALL COLLISIONS
    */

    if(r.x+r.radius>W){

      r.x=W-r.radius;
      r.vx*=-.78;
    }

    if(r.x-r.radius<0){

      r.x=r.radius;
      r.vx*=-.78;
    }


    robotPigCollisions(r);
    robotBlockCollisions(r);
    bonusCollisions(r);
  }
}


/* =========================
   ROBO / PIG COLLISION
========================= */

function robotPigCollisions(r){

  for(const p of pigs){

    if(!p.alive || p.spawnGrace>0 || r.hitPigs.has(p))
      continue;

    const dx=p.x-r.x;
    const dy=p.y-r.y;

    const d=Math.hypot(dx,dy);

    if(d>r.radius+p.radius)
      continue;

    r.hitPigs.add(p);

    const speed=Math.hypot(r.vx,r.vy);

    p.vx+=dx/Math.max(d,1)*speed*.10;
    p.vy+=dy/Math.max(d,1)*speed*.04;

    p.vy*=.15;


    /*
      Robo does NOT bounce because of a pig.
      Its velocity is deliberately untouched.
    */

    if(speed>180)
      killPig(p);
  }
}


function killPig(p){

  if(!p.alive)
    return;

  // Each enemy can take damage only once from a single fired Robo.
  // This prevents a direct hit + chain reaction in the same shot from
  // instantly consuming the entire Level 1 health pool.
  if(p.lastDamageShot===levelShots)
    return;

  p.lastDamageShot=levelShots;

  if((p.health ?? 1)>1){
    p.health--;
    p.hitFlash=.18;
    p.vx*=0.35;
    p.vy=-80;
    score+=40;
    cameraShake=Math.max(cameraShake,2.5);
    updateUI();
    burst(p.x,p.y,16);
    return;
  }

  p.alive=false;
  p.health=0;
  p.vx=0;
  p.vy=0;
  p.hitFlash=.25;
  cameraShake=Math.max(cameraShake,5.5);

  score+=100;

  updateUI();
  burst(p.x,p.y,28);
}


/* =========================
   ROBO / BLOCK COLLISION
========================= */

function robotBlockCollisions(r){

  for(const b of blocks){

    if(b.destroyed || r.hitBlocks.has(b))
      continue;

    const closestX=Math.max(b.x, Math.min(r.x, b.x+b.w));
    const closestY=Math.max(b.y, Math.min(r.y, b.y+b.h));

    let nx=r.x-closestX;
    let ny=r.y-closestY;
    let dist=Math.hypot(nx,ny);

    if(dist>r.radius)
      continue;

    // Resolve the collision before reflecting velocity so the Robo
    // cannot remain embedded in the block and lose its bounce.
    if(dist<0.0001){
      const left=Math.abs(r.x-b.x);
      const right=Math.abs((b.x+b.w)-r.x);
      const top=Math.abs(r.y-b.y);
      const bottom=Math.abs((b.y+b.h)-r.y);
      const m=Math.min(left,right,top,bottom);

      if(m===left){ nx=-1; ny=0; }
      else if(m===right){ nx=1; ny=0; }
      else if(m===top){ nx=0; ny=-1; }
      else { nx=0; ny=1; }

      dist=0;
    }else{
      nx/=dist;
      ny/=dist;
    }

    r.hitBlocks.add(b);

    const impactSpeed=Math.hypot(r.vx,r.vy);
    if(impactSpeed>120){
      cameraShake=Math.max(cameraShake,Math.min(6,2+impactSpeed/240));
      burst(r.x,r.y,Math.min(10,4+Math.floor(impactSpeed/220)));
    }

    // First-shot impact damages the block; later impacts still push it.
    if(r.bounced===true){
      pushBlock(b,r,.35);
    }else{
      damageBlock(b,r.damage,r);
    }

    // Push the Robo completely out of the block.
    const penetration=Math.max(0,r.radius-dist)+1.5;
    r.x+=nx*penetration;
    r.y+=ny*penetration;

    // Proper elastic-ish reflection against the impact normal.
    // This makes Level 1 blocks produce a visible, controllable bounce.
    const vn=r.vx*nx+r.vy*ny;
    if(vn<0){
      const restitution = level===1 ? 0.84 : 0.78;
      r.vx -= (1+restitution)*vn*nx;
      r.vy -= (1+restitution)*vn*ny;
    }

    // Preserve some energy while preventing numerical jitter.
    r.vx*=0.985;
    r.vy*=0.985;
  }
}

/* =========================
   BLOCK PUSHING
========================= */

function pushBlock(b,r,factor){

  const cx=b.x+b.w/2;
  const cy=b.y+b.h/2;

  const dx=cx-r.x;
  const dy=cy-r.y;

  const d=Math.max(Math.hypot(dx,dy),1);

  const speed=Math.hypot(r.vx,r.vy);

  // A real Robo hit wakes the block and activates the structure physics.
  // Until the player actually hits something, the starting tower cannot
  // collapse and cannot crush an enemy.
  structureActivated=true;
  b.awake=true;
  b.vx+=dx/d*speed*factor;
  b.vy+=dy/d*speed*factor;

  // A direct hit explicitly activates physics on this block.
  // Booster blocks remain stabilized vertically but can still be pushed.
  if(b.booster){
    b.falling=false;
  }else{
    b.falling=true;
  }
}


/* =========================
   BLOCK DAMAGE
========================= */

function damageBlock(b,damage,r){

  if(b.destroyed)
    return;

  /*
    Safety check:
    A bounced Robo can NEVER deal damage.
  */

  if(r.bounced === true)
    return;

  b.health=Math.max(
    0,
    b.health-damage
  );

  pushBlock(b,r,.30);

  burst(
    r.x,
    r.y,
    Math.min(
      8,
      Math.max(2,Math.floor(damage/12))
    )
  );

  if(b.health<=0)
    destroyBlock(b);
}


function destroyBlock(b){

  if(b.destroyed)
    return;

  b.destroyed=true;

  score+=25;

  updateUI();

  burst(
    b.x+b.w/2,
    b.y+b.h/2,
    30
  );
  cameraShake=Math.max(cameraShake,6);
}


/* =========================
   BLOCK SUPPORT / PHYSICS
========================= */

function blockSupported(b){

  if(b.destroyed)
    return false;

  if(b.y+b.h>=GROUND-3)
    return true;

  for(const o of blocks){

    if(o===b || o.destroyed)
      continue;

    // Edge-to-edge contact counts as connected support.
    // Level pieces are designed to meet exactly at their edges.
    const horizontal=
      b.x<=o.x+o.w+0.01 &&
      b.x+b.w>=o.x-0.01;

    const vertical=
      Math.abs(b.y+b.h-o.y)<7;

    if(horizontal && vertical)
      return true;
  }

  return false;
}


function updateBlocks(dt){

  for(const b of blocks){

    if(b.destroyed)
      continue;

    /*
      BEFORE THE FIRST PLAYER HIT:
      Preserve the level blueprint exactly.
    */
    if(!structureActivated && !b.awake){
      b.x=b.spawnX;
      b.y=b.spawnY;
      b.vx=0;
      b.vy=0;
      b.falling=false;
      continue;
    }

    const supported=blockSupported(b);

    /*
      A block that loses its support becomes dynamic.
      Booster blocks are the exception: their jets can hold them up.
    */
    if(!b.awake && !supported && !b.booster){
      b.awake=true;
      b.falling=true;
    }

    if(b.awake){

      if(b.booster){
        /*
          Jet-assisted stabilization:
          when unsupported, the booster cancels gravity instead of letting
          the block fall. Existing velocity from a real impact remains,
          so boosters do not disable horizontal physics.
        */
        if(!supported){
          b.vy+=G*b.boosterPower*dt;
          b.vy-=G*dt;
          b.vy*=Math.pow(.92,dt*60);
        }else{
          // On a support, damp vertical jitter while retaining horizontal motion.
          b.vy*=Math.pow(.72,dt*60);
        }

        b.falling=false;
      }else if(!supported || b.falling || Math.abs(b.vy)>8){
        b.falling=true;
        b.vy+=G*dt;
      }else{
        b.vy=0;
        b.falling=false;
      }

    }else{
      b.vx=0;
      b.vy=0;
      b.falling=false;
    }

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    b.vx*=Math.pow(.985,dt*60);

    // Ground collision.
    if(b.y+b.h>=GROUND){
      b.y=GROUND-b.h;

      if(Math.abs(b.vy)>35)
        b.vy*=-.18;
      else
        b.vy=0;

      b.vx*=.82;
    }

    if(b.x<0){
      b.x=0;
      b.vx*=-.2;
    }

    if(b.x+b.w>W){
      b.x=W-b.w;
      b.vx*=-.2;
    }
  }

  /*
    Block-to-block physics.
    A moving/awake block transfers motion to a block it hits and wakes it.
    This stops the tower from behaving like a collection of frozen sprites.
  */
  for(let i=0;i<blocks.length;i++){

    const a=blocks[i];
    if(a.destroyed) continue;

    for(let j=i+1;j<blocks.length;j++){

      const b=blocks[j];
      if(b.destroyed) continue;

      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);
      const oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);

      if(ox<=0 || oy<=0)
        continue;

      const relativeSpeed=Math.hypot(a.vx-b.vx,a.vy-b.vy);
      const dynamicContact=a.awake || b.awake || relativeSpeed>8;

      // If an active block physically contacts a resting block, wake the resting block.
      if(dynamicContact){
        if(!a.awake) a.awake=true;
        if(!b.awake) b.awake=true;
      }

      if(oy<ox){

        if(a.y<b.y){
          a.y-=oy/2;
          b.y+=oy/2;
        }else{
          a.y+=oy/2;
          b.y-=oy/2;
        }

        const av=a.vy;
        const bv=b.vy;
        a.vy=bv*.18;
        b.vy=av*.18;

      }else{

        if(a.x<b.x){
          a.x-=ox/2;
          b.x+=ox/2;
        }else{
          a.x+=ox/2;
          b.x-=ox/2;
        }

        const av=a.vx;
        const bv=b.vx;
        a.vx=bv*.32;
        b.vx=av*.32;
      }

      // Booster blocks retain their stabilization after collisions.
      if(a.booster) a.falling=false;
      if(b.booster) b.falling=false;
    }
  }
}

/* =========================
   PIG PHYSICS
========================= */

function updatePigs(dt){

  for(const p of pigs){

    if(!p.alive)
      continue;

    if(p.spawnGrace>0)
      p.spawnGrace=Math.max(0,p.spawnGrace-dt);
    p.hitFlash=Math.max(0,(p.hitFlash||0)-dt);

    /*
      HARD SPAWN LOCK:
      Before the player hits any block, enemies stay exactly at their
      designed spawn positions. This prevents gravity/support jitter from
      making them fall at the start of the level.
    */
    if(!structureActivated){
      p.x=p.spawnX;
      p.y=p.spawnY;
      p.vx=0;
      p.vy=0;
      p.supported=true;
      continue;
    }

    let supportY=null;

    // Ground support.
    if(p.y+p.radius>=GROUND-3)
      supportY=GROUND-p.radius;

    // Only a block's TOP surface supports a pig.
    for(const b of blocks){

      if(b.destroyed)
        continue;

      const horizontal =
        p.x > b.x-p.radius &&
        p.x < b.x+b.w+p.radius;

      const standingOnTop =
        p.y <= b.y+8 &&
        p.y+p.radius >= b.y-8 &&
        p.vy >= 0;

      if(horizontal && standingOnTop){
        const candidate=b.y-p.radius;
        if(supportY===null || candidate<supportY)
          supportY=candidate;
      }
    }

    if(supportY!==null && p.vy>=0){

      p.y=supportY;

      if(p.vy>30)
        p.vy*=-PIG_BOUNCE;
      else
        p.vy=0;

      p.vx*=.70;

    }else{
      p.vy+=G*dt;
    }

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=Math.pow(.985,dt*60);

    // Ground collision.
    if(p.y+p.radius>=GROUND){

      p.y=GROUND-p.radius;

      if(p.vy>30)
        p.vy*=-PIG_BOUNCE;
      else
        p.vy=0;

      p.vx*=.70;
    }

    // Spawn protection: enemies cannot be killed by structure physics
    // while the starting tower is still untouched.
    if(p.spawnGrace>0 || !structureActivated)
      continue;

    // IMPORTANT:
    // Never kill a pig just because its static spawn position is close
    // to two blocks. A crush requires an actively moving block.
    for(const b of blocks){

      if(b.destroyed || !b.awake)
        continue;

      const cx=Math.max(b.x,Math.min(p.x,b.x+b.w));
      const cy=Math.max(b.y,Math.min(p.y,b.y+b.h));
      const dx=p.x-cx;
      const dy=p.y-cy;

      if(dx*dx+dy*dy > p.radius*p.radius)
        continue;

      const blockSpeed=Math.hypot(b.vx,b.vy);

      // Stationary blocks can NEVER crush an enemy.
      if(blockSpeed < 90)
        continue;

      // Determine whether the block is moving into the pig.
      const blockCenterX=b.x+b.w/2;
      const blockCenterY=b.y+b.h/2;

      const towardX =
        Math.sign(p.x-blockCenterX) === Math.sign(b.vx) ||
        Math.abs(b.vx)<10;

      const towardY =
        Math.sign(p.y-blockCenterY) === Math.sign(b.vy) ||
        Math.abs(b.vy)<10;

      if(towardX || towardY){
        killPig(p);
        break;
      }
    }
  }
}

/* =========================
   PIG / PIG + CRUSH COLLISIONS
========================= */

/*
  Enemies collide physically. A real impact kills BOTH pigs.
  Low-speed numerical overlap is separated instead of causing
  accidental deaths.
*/
function pigPigCollisions(){
  for(let i=0;i<pigs.length;i++){
    const a=pigs[i];
    if(!a.alive || a.spawnGrace>0) continue;

    for(let j=i+1;j<pigs.length;j++){
      const b=pigs[j];
      if(!b.alive || b.spawnGrace>0) continue;

      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.hypot(dx,dy);
      const minDist=a.radius+b.radius;
      if(d>=minDist) continue;

      // A pig that is descending onto another pig is a distinct "landing" event.
      // The landing pig and the pig underneath are both destroyed instantly.
      const horizontalOverlap=(a.radius+b.radius)-Math.abs(dx);
      const aLandingOnB =
        a.y < b.y &&
        a.vy > 70 &&
        horizontalOverlap > Math.max(10,a.radius*.30) &&
        a.y+a.radius >= b.y-b.radius-10;
      const bLandingOnA =
        b.y < a.y &&
        b.vy > 70 &&
        horizontalOverlap > Math.max(10,b.radius*.30) &&
        b.y+b.radius >= a.y-a.radius-10;

      if(aLandingOnB || bLandingOnA){
        const x=(a.x+b.x)/2, y=(a.y+b.y)/2;
        smashPig(a);smashPig(b);
        cameraShake=Math.max(cameraShake,7);
        burst(x,y,30);
        continue;
      }

      const nx=dx/Math.max(d,.001), ny=dy/Math.max(d,.001);
      const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
      const impact=Math.abs(rvx*nx+rvy*ny);

      // Existing enemy-vs-enemy collision behavior remains unchanged.
      if(impact>12 || Math.hypot(a.vx,a.vy)>35 || Math.hypot(b.vx,b.vy)>35){
        const x=(a.x+b.x)/2, y=(a.y+b.y)/2;
        killPig(a);killPig(b);burst(x,y,24);continue;
      }

      // Separate gentle overlaps instead of creating accidental damage.
      const correction=(minDist-d)/2;
      a.x-=nx*correction;a.y-=ny*correction;
      b.x+=nx*correction;b.y+=ny*correction;
    }
  }
}

function smashPig(p){
  if(!p.alive) return;
  p.alive=false;
  p.health=0;
  p.vx=0;
  p.vy=0;
  p.hitFlash=.30;
  score+=100;
  updateUI();
  burst(p.x,p.y,24);
}

/*
  Detects a pig being crushed/caught between blocks.
/*
  Detects a pig being crushed/caught between blocks.

  We require blocks on opposite sides (left/right or top/bottom),
  or two moving blocks pressing into the pig. This avoids killing
  a pig merely because it is standing on one block.
*/
function pigCrushCollisions(){
  // No crush logic is active until the player has actually hit a block.
  // This prevents all forms of spawn camping.
  if(!structureActivated) return;

  // A stationary starting structure can NEVER crush a pig.
  // Crushing requires an awake block that is actually moving fast enough.
  for(const p of pigs){
    if(!p.alive) continue;

    for(const b of blocks){
      if(b.destroyed || !b.awake) continue;

      const cx=Math.max(b.x,Math.min(p.x,b.x+b.w));
      const cy=Math.max(b.y,Math.min(p.y,b.y+b.h));
      const dx=p.x-cx, dy=p.y-cy;
      if(dx*dx+dy*dy > p.radius*p.radius) continue;

      const speed=Math.hypot(b.vx,b.vy);
      if(speed < 120) continue;

      // Only count motion toward the pig, along the collision direction.
      const dist=Math.hypot(dx,dy);
      if(dist < 0.001) continue;
      const nx=dx/dist, ny=dy/dist;
      const closing=b.vx*nx+b.vy*ny;

      if(closing > 80){
        killPig(p);
        break;
      }
    }
  }
}

function bonusCollisions(r){

  for(const s of stars){

    if(s.taken)
      continue;

    if(
      Math.hypot(
        r.x-s.x,
        r.y-s.y
      )<r.radius+s.r
    ){

      s.taken=true;

      score+=s.points;

      updateUI();

      burst(s.x,s.y,14);
    }
  }


  for(const q of rings){

    if(q.taken)
      continue;

    if(
      Math.hypot(
        r.x-q.x,
        r.y-q.y
      )<q.r
    ){

      q.taken=true;

      score+=q.points;

      updateUI();

      burst(q.x,q.y,14);
    }
  }
}


/* =========================
   PARTICLES
========================= */

function burst(x,y,n,palette=null){
  const colors=palette || (level===1
    ? ["#ff8fbc","#ffd56a","#8ddcff","#ffffff"]
    : ["#c9a7ff","#ff9fcf","#87e9c0","#ffe083","#ffffff"]);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=60+Math.random()*220;
    particles.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      life:.4+Math.random()*.6,
      size:3+Math.random()*5,
      color:colors[(Math.random()*colors.length)|0]
    });
  }
}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.vy+=500*dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

  if(isTwo){
    // Cyber shell.
    const g=ctx.createRadialGradient(-9,-12,2,0,0,31);
    g.addColorStop(0,"#e5fbff");
    g.addColorStop(.32,"#63d4e7");
    g.addColorStop(.68,"#1a6484");
    g.addColorStop(1,"#071b31");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#42dfff";ctx.lineWidth=2.5;ctx.shadowColor="#42dfff";ctx.shadowBlur=11;ctx.stroke();ctx.shadowBlur=0;

    // Ears / side fins.
    ctx.fillStyle="#123f59";
    ctx.beginPath();ctx.moveTo(-19,-19);ctx.lineTo(-29,-33);ctx.lineTo(-9,-25);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(19,-19);ctx.lineTo(29,-33);ctx.lineTo(9,-25);ctx.closePath();ctx.fill();

    // Visor.
    ctx.fillStyle="#06111f";ctx.strokeStyle="rgba(66,223,255,.9)";ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-20,-12,40,18,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=`rgba(70,235,255,${.72+.28*pulse})`;ctx.shadowColor="#42dfff";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(-10,-3,4,0,Math.PI*2);ctx.arc(10,-3,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

    // Brow plates.
    ctx.strokeStyle="#081525";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-17,-13);ctx.lineTo(-5,-10);ctx.moveTo(17,-13);ctx.lineTo(5,-10);ctx.stroke();

    // Snout module.
    ctx.fillStyle="#18384c";ctx.strokeStyle="#59e8ff";ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-14,9,28,14,6);ctx.fill();ctx.stroke();
    ctx.fillStyle="#06111f";ctx.beginPath();ctx.arc(-6,15,3,0,Math.PI*2);ctx.arc(6,15,3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#8ff6ff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,25);ctx.lineTo(0,20);ctx.lineTo(9,25);ctx.stroke();

    // Antenna.
    ctx.strokeStyle="#4de9ff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,-39);ctx.stroke();
    ctx.fillStyle="#ff4d9d";ctx.shadowColor="#ff4d9d";ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,-41,4.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

  }else{
    // Cute Level 1 pig.
    const ear=ctx.createLinearGradient(0,-35,0,-12);
    ear.addColorStop(0,"#ffb7cf");ear.addColorStop(1,"#ff8eb9");ctx.fillStyle=ear;
    ctx.beginPath();ctx.moveTo(-18,-18);ctx.quadraticCurveTo(-30,-37,-12,-29);ctx.quadraticCurveTo(-5,-25,-9,-17);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(18,-18);ctx.quadraticCurveTo(30,-37,12,-29);ctx.quadraticCurveTo(5,-25,9,-17);ctx.closePath();ctx.fill();

    const g=ctx.createRadialGradient(-9,-12,2,0,0,31);
    g.addColorStop(0,"#fff5fb");g.addColorStop(.45,"#ffc4df");g.addColorStop(.82,"#ff99c2");g.addColorStop(1,"#ea6f9d");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#d95f8f";ctx.lineWidth=2.5;ctx.stroke();

    ctx.fillStyle="#ffd86e";ctx.beginPath();ctx.moveTo(-7,-25);ctx.quadraticCurveTo(0,-36,7,-25);ctx.quadraticCurveTo(4,-20,0,-22);ctx.quadraticCurveTo(-4,-20,-7,-25);ctx.fill();

    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-10,-6,9,11,0,0,Math.PI*2);ctx.ellipse(10,-6,9,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#5a4059";ctx.beginPath();ctx.arc(-8,-4,4.5,0,Math.PI*2);ctx.arc(8,-4,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-6.5,-6,1.5,0,Math.PI*2);ctx.arc(9.5,-6,1.5,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle="#914f75";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-18,-15);ctx.lineTo(-13,-17);ctx.moveTo(18,-15);ctx.lineTo(13,-17);ctx.stroke();
    ctx.fillStyle="#ff8fae";ctx.beginPath();ctx.ellipse(0,10,13,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#9d4f69";ctx.beginPath();ctx.ellipse(-5,10,2.7,2.2,0,0,Math.PI*2);ctx.ellipse(5,10,2.7,2.2,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#944765";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,14,7,.15,Math.PI-.15);ctx.stroke();
    ctx.fillStyle="rgba(255,103,151,.45)";ctx.beginPath();ctx.ellipse(-19,10,6,3.5,0,0,Math.PI*2);ctx.ellipse(19,10,6,3.5,0,0,Math.PI*2);ctx.fill();
  }

  // Two-hit indicator. Normal Robo damage still uses the exact same health system.
  ctx.shadowBlur=0;
  for(let i=0;i<2;i++){
    const full=i<(p.health||0);
    ctx.fillStyle=full?(isTwo?"#55ecff":"#ff86b8"):"rgba(255,255,255,.30)";
    ctx.strokeStyle=isTwo?"rgba(66,223,255,.36)":"rgba(90,64,85,.16)";
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(-7.5+i*15,-45,4.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  }

  if((p.hitFlash||0)>0){
    ctx.globalAlpha=Math.min(.58,(p.hitFlash/.20)*.58);
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,31,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }

  ctx.restore();
}

function drawBlock(b){
  if(b.destroyed) return;

  const isTwo=level===2;
  ctx.save();

  if(isTwo){
    const g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);
    g.addColorStop(0,"#0b263c");g.addColorStop(.48,"#1a5871");g.addColorStop(1,"#071827");
    ctx.fillStyle=g;
    ctx.strokeStyle=b.booster?"#55ecff":"#42dfff";
    ctx.lineWidth=b.booster?2.8:2.5;
    ctx.shadowColor=b.booster?"rgba(85,236,255,.50)":"rgba(66,223,255,.34)";
    ctx.shadowBlur=b.booster?12:8;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,Math.min(7,b.h*.25));ctx.fill();ctx.stroke();ctx.shadowBlur=0;

    if(b.w>70 || b.h>45){
      ctx.strokeStyle="rgba(102,240,255,.30)";ctx.lineWidth=1.5;
      ctx.strokeRect(b.x+6,b.y+6,Math.max(1,b.w-12),Math.max(1,b.h-12));
    }

    // Circuit trace.
    ctx.strokeStyle="rgba(112,244,255,.40)";ctx.lineWidth=1.5;
    const cy=b.y+b.h/2;
    ctx.beginPath();ctx.moveTo(b.x+8,cy);ctx.lineTo(b.x+20,cy);ctx.lineTo(b.x+28,cy-5);
    if(b.w>90){ctx.lineTo(b.x+b.w-28,cy-5);ctx.lineTo(b.x+b.w-20,cy);ctx.lineTo(b.x+b.w-8,cy)}
    else{ctx.lineTo(b.x+b.w-8,cy)}
    ctx.stroke();

    const nodes=b.w>90?3:2;
    for(let i=0;i<nodes;i++){
      const x=b.x+12+(b.w-24)*(i/Math.max(nodes-1,1));
      ctx.fillStyle="#55ecff";ctx.shadowColor="#55ecff";ctx.shadowBlur=7;
      ctx.beginPath();ctx.arc(x,b.y+9,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }

    if(b.booster){
      const boostCount=b.w>180?3:(b.w>70?2:1);
      for(let i=0;i<boostCount;i++){
        const bx=b.x+b.w*(i+1)/(boostCount+1),by=b.y+b.h+4;
        ctx.fillStyle="#102d42";ctx.strokeStyle="#55ecff";ctx.lineWidth=1.5;
        ctx.beginPath();ctx.roundRect(bx-8,by-3,16,9,3);ctx.fill();ctx.stroke();
        const flame=7+Math.sin(performance.now()*.012+bx)*3;
        ctx.fillStyle="rgba(70,235,255,.72)";ctx.shadowColor="#42dfff";ctx.shadowBlur=7;
        ctx.beginPath();ctx.moveTo(bx-4,by+5);ctx.lineTo(bx+4,by+5);ctx.lineTo(bx,by+5+flame);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      }
    }

    // Damage wear: only visual, based on existing block health.
    const damage=1-Math.max(0,b.health)/Math.max(1,b.maxHealth||160);
    if(damage>.08){
      const count=Math.min(5,1+Math.floor(damage*6));
      ctx.strokeStyle=`rgba(210,252,255,${.16+.22*damage})`;ctx.lineWidth=1.4;ctx.lineCap="round";
      for(let i=0;i<count;i++){
        const seed=(b.spawnX*13+b.spawnY*7+i*31);
        const sx=b.x+7+(Math.abs(seed)%Math.max(10,b.w-14));
        const sy=b.y+8+(Math.abs(seed*1.7)%Math.max(8,b.h-16));
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+6,sy+4);ctx.lineTo(sx+3,sy+9);ctx.stroke();
      }
    }

    ctx.fillStyle="#9ff7ff";
    const corners=[[b.x+7,b.y+7],[b.x+b.w-7,b.y+7],[b.x+7,b.y+b.h-7],[b.x+b.w-7,b.y+b.h-7]];
    for(const [x,y] of corners){ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}
    ctx.restore();
    return;
  }

  // Cute Level 1 block.
  const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
  g.addColorStop(0,"#fff0b5");g.addColorStop(.45,"#ffd58f");g.addColorStop(1,"#f6a96b");
  ctx.fillStyle=g;ctx.strokeStyle="#c97b5b";ctx.lineWidth=3;
  ctx.shadowColor="rgba(230,146,89,.20)";ctx.shadowBlur=10;
  const radius=Math.min(10,b.h/2,Math.max(3,b.w/8));
  ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,radius);ctx.fill();ctx.stroke();ctx.shadowBlur=0;

  ctx.strokeStyle="rgba(255,255,255,.38)";ctx.lineWidth=2;
  for(let y=b.y+9;y<b.y+b.h;y+=13){ctx.beginPath();ctx.moveTo(b.x+7,y);ctx.lineTo(b.x+b.w-7,y);ctx.stroke();}
  ctx.fillStyle="#ff8fbc";
  for(const x of [b.x+8,b.x+b.w-8]){
    if(x<b.x+b.w-2){ctx.beginPath();ctx.arc(x,b.y+b.h/2,2.5,0,Math.PI*2);ctx.fill();}
  }

  // Light wear as blocks take damage.
  const damage=1-Math.max(0,b.health)/Math.max(1,b.maxHealth||100);
  if(damage>.10){
    ctx.strokeStyle=`rgba(146,82,64,${.15+.22*damage})`;ctx.lineWidth=1.3;
    const count=Math.min(4,1+Math.floor(damage*5));
    for(let i=0;i<count;i++){
      const seed=b.spawnX*11+b.spawnY*5+i*17;
      const sx=b.x+6+(Math.abs(seed)%Math.max(8,b.w-12));
      const sy=b.y+7+(Math.abs(seed*1.3)%Math.max(6,b.h-12));
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+5,sy+4);ctx.lineTo(sx+2,sy+8);ctx.stroke();
    }
  }
  ctx.restore();
}

function drawStar(s){

  if(s.taken)
    return;

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.rotate(performance.now()*.001);

  ctx.fillStyle="#ffd166";
  ctx.shadowColor="#ffd166";
  ctx.shadowBlur=18;

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const a=-Math.PI/2+i*Math.PI/5;

    const r=
      i%2===0
      ? s.r
      : s.r*.42;

    const x=Math.cos(a)*r;
    const y=Math.sin(a)*r;

    if(i===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.restore();
}


function drawRing(q){

  if(q.taken)
    return;

  ctx.save();

  ctx.strokeStyle="#ffd166";
  ctx.lineWidth=8;
  ctx.shadowColor="#ffd166";
  ctx.shadowBlur=15;

  ctx.beginPath();

  ctx.arc(
    q.x,
    q.y,
    q.r,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.restore();
}


/* =========================
   TRAJECTORY
========================= */

function drawTrajectory(){
  if(!dragging||!currentRobo||!currentRobo.ready) return;

  let x=currentRobo.x,y=currentRobo.y;
  const boost=level===2?1.35:1;
  let vx=(SLING.x-x)*POWER_MULT*boost;
  let vy=(SLING.y-y)*POWER_MULT*boost;
  let fuel=level===2?1.15:0;
  const thrustPower=level===2?620:0;
  const dt=1/60;

  ctx.save();
  ctx.fillStyle=level===1?"rgba(255,255,255,.86)":"rgba(255,255,255,.92)";
  for(let t=0;t<4;t+=dt){
    if(fuel>0){
      const speed=Math.hypot(vx,vy);
      if(speed>10){
        const nx=vx/speed,ny=vy/speed,thrust=Math.min(fuel,dt)*thrustPower;
        vx+=nx*thrust;vy+=ny*thrust;
      }
      fuel=Math.max(0,fuel-dt);
    }
    vy+=G*dt;vx*=Math.pow(.999,dt*60);vy*=Math.pow(.999,dt*60);x+=vx*dt;y+=vy*dt;
    if(y+26>=GROUND) break;
    if(Math.floor(t*12)!==Math.floor((t-dt)*12)){
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.fillStyle=p.color||"#ffd166";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* =========================
   MAIN DRAW
========================= */

function draw(){
  const cssW=Math.max(320,window.innerWidth),cssH=Math.max(240,window.innerHeight);
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  ctx.fillStyle=level===1?"#dff7ff":"#020611";ctx.fillRect(0,0,cssW,cssH);

  const shake=cameraShake||0;
  const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
  ctx.save();
  ctx.translate(view.ox+sx,view.oy+sy);ctx.scale(view.scale,view.scale);

  drawBackground();
  if(level===1){cloud(180,110,1);cloud(540,90,.8);cloud(920,150,.7);}

  for(const b of blocks) drawBlock(b);
  for(const q of rings) drawRing(q);
  for(const st of stars) drawStar(st);
  for(const p of pigs) drawPig(p);
  for(const r of robos) drawRobo(r);
  drawSling();drawTrajectory();
  if(currentRobo) drawRobo(currentRobo);
  drawParticles();
  ctx.restore();
}

/* =========================
   GAME LOOP
========================= */

let last=performance.now();

function loop(now){

  let dt=Math.min(
    (now-last)/1000,
    .025
  );

  last=now;

  updateBlocks(dt);
  updatePigs(dt);

  // Check enemy-vs-enemy impacts and crushing after both
  // pig and block positions have been updated for this frame.
  pigPigCollisions();
  pigCrushCollisions();

  updateRobos(dt);
  updateParticles(dt);
  cameraShake=Math.max(0,cameraShake-dt*18);


  if(!gameWon && pigs.length && pigs.every(p=>!p.alive)){
    if(level===2 && levelShots<2){
      gameWon=false;
      currentRobo=currentRobo || newRobo();
      updateUI();
    }else{
      gameWon=true;
      document.getElementById("msg").innerHTML=
        level===2
          ? "LEVEL 2 CLEARED<br><small>Rainbow kingdom secured · Score: "+score+"</small>"
          : "TARGETS CLEARED<br><small>Cute city cleared · Score: "+score+"</small>";
      document.getElementById("msg").style.display="block";
    }
  }


  draw();

  requestAnimationFrame(loop);
}


/* =========================
   CONTROLS
========================= */

document.getElementById("reset").onclick=resetGame;

function switchLevel(newLevel){
  level=newLevel;
  levelShots=0;
  gameWon=false;
  structureActivated=false;
  dragging=false;
  keyboardAim=0;
  keyboardPower=0;
  keyboardActive=false;
  hardwareAim=0;
  hardwarePower=0;
  robos=[];
  particles=[];
  cameraShake=0;
  last=performance.now();
  createLevel();
  currentRobo=newRobo();
  if(controlMode==="serial") updateHardwarePouch();
  updateUI();
  document.getElementById("msg").style.display="none";
  document.getElementById("power").style.display="none";
}

document.getElementById("level1Btn").onclick=()=>switchLevel(1);
document.getElementById("level2Btn").onclick=()=>switchLevel(2);

document.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();

  if(key==="r"){
    resetGame();
    return;
  }

  // Keyboard simulation advertised in the help panel.
  if(["w","s","a","d"," "].includes(key)){
    e.preventDefault();
  }

  if(controlMode==="serial" || gameWon || !currentRobo || !currentRobo.ready)
    return;

  let changed=false;

  if(key==="w"){
    keyboardAim=Math.max(-1,keyboardAim-0.08);
    changed=true;
  }else if(key==="s"){
    keyboardAim=Math.min(1,keyboardAim+0.08);
    changed=true;
  }else if(key==="a"){
    keyboardPower=Math.max(0,keyboardPower-0.05);
    changed=true;
  }else if(key==="d"){
    keyboardPower=Math.min(1,keyboardPower+0.05);
    changed=true;
  }else if(e.code==="Space"){
    if(keyboardPower>0){
      updateKeyboardPouch();
      document.getElementById("power").style.display="none";
      fireRobo();
    }
    return;
  }

  if(changed){
    keyboardActive=true;
    controlMode="keyboard";
    updateKeyboardPouch();
    updateControllerStatus();
    document.getElementById("power").style.display="block";
  }
});


/* =========================
   START
========================= */

resetGame();

requestAnimationFrame(loop);

</script>
